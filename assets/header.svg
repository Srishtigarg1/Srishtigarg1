<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 320"
     width="1200"
     height="320">

  <defs>

    <!-- Animated Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%">
        <animate attributeName="stop-color"
          values="#071A52;#0F4CFF;#6C63FF;#071A52"
          dur="10s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%">
        <animate attributeName="stop-color"
          values="#3F5EFB;#7F5AF0;#00B4FF;#3F5EFB"
          dur="10s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>

    <!-- Text Glow -->
    <filter id="glow" x="-50%" y="-50%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->

  <rect
      width="1200"
      height="320"
      rx="35"
      fill="url(#bg)"/>

  <!-- Stars -->
    <g fill="white">

    <circle cx="90" cy="45" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="180" cy="85" r="1.5">
      <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="320" cy="55" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="470" cy="40" r="1.8">
      <animate attributeName="opacity" values="1;0;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="640" cy="70" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="820" cy="45" r="2">
      <animate attributeName="opacity" values="1;0;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="990" cy="80" r="1.6">
      <animate attributeName="opacity" values="0;1;0" dur="2.7s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1120" cy="50" r="2">
      <animate attributeName="opacity" values="1;0;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Wave 1 -->

  <path
    fill="white"
    fill-opacity="0.08"
    d="M0 250
       C180 220 280 300 450 255
       C650 205 780 300 1200 240
       L1200 320
       L0 320 Z">

    <animate
      attributeName="d"
      dur="8s"
      repeatCount="indefinite"
      values="
      M0 250 C180 220 280 300 450 255 C650 205 780 300 1200 240 L1200 320 L0 320 Z;
      M0 240 C150 290 320 200 500 260 C700 310 900 210 1200 250 L1200 320 L0 320 Z;
      M0 250 C180 220 280 300 450 255 C650 205 780 300 1200 240 L1200 320 L0 320 Z"/>
  </path>

  <!-- Wave 2 -->

  <path
    fill="white"
    fill-opacity="0.04"
    d="M0 275
       C200 250 380 315 600 280
       C800 245 980 315 1200 270
       L1200 320
       L0 320 Z">

    <animate
      attributeName="d"
      dur="10s"
      repeatCount="indefinite"
      values="
      M0 275 C200 250 380 315 600 280 C800 245 980 315 1200 270 L1200 320 L0 320 Z;
      M0 265 C180 315 420 240 650 295 C860 250 1030 305 1200 260 L1200 320 L0 320 Z;
      M0 275 C200 250 380 315 600 280 C800 245 980 315 1200 270 L1200 320 L0 320 Z"/>
  </path>

    <!-- Typing Animation -->

  <defs>
    <clipPath id="typingClip">
      <rect x="120" y="90" width="0" height="90">
        <animate
          attributeName="width"
          values="0;520;520;0"
          keyTimes="0;0.45;0.85;1"
          dur="5s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <text
      x="600"
      y="170"
      text-anchor="middle"
      clip-path="url(#typingClip)"
      font-family="Segoe UI, Arial, Helvetica, sans-serif"
      font-size="56"
      font-weight="700"
      fill="white"
      filter="url(#glow)">

      Hi, I'm Srishti Garg

  </text>

  <!-- Cursor -->

  <rect
      x="120"
      y="122"
      width="5"
      height="58"
      rx="2"
      fill="white">

      <animate
          attributeName="x"
          values="120;645;645;120"
          keyTimes="0;0.45;0.85;1"
          dur="5s"
          repeatCount="indefinite"/>

      <animate
          attributeName="opacity"
          values="1;0;1"
          dur="0.8s"
          repeatCount="indefinite"/>

  </rect>

    <!-- Soft Highlight -->
  <ellipse
      cx="600"
      cy="300"
      rx="520"
      ry="90"
      fill="white"
      opacity="0.03">

      <animate
          attributeName="opacity"
          values="0.02;0.05;0.02"
          dur="6s"
          repeatCount="indefinite"/>

  </ellipse>

</svg>
