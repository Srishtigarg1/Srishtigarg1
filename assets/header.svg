<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 240"
     width="1600"
     height="240">

  <defs>

    <!-- Animated Background -->
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">

    <stop offset="0%" stop-color="#4FD1A8"/>

    <stop offset="25%" stop-color="#48C7AE"/>

    <stop offset="50%" stop-color="#3FB9B7"/>

    <stop offset="75%" stop-color="#318FB7"/>

    <stop offset="100%" stop-color="#2B6CB0"/>

</linearGradient>
    

    <!-- Text Glow --> <filter id="glow" x="-50%" y="-50%" width="180%" height="180%"> <feGaussianBlur stdDeviation="4.5" result="blur"/> <feMerge> <feMergeNode in="blur"/> <feMergeNode in="SourceGraphic"/> </feMerge> </filter>


       <clipPath id="typingClip">
    <rect x="430" y="70" width="0" height="110">
    <animate
        attributeName="width"
        values="0;740;740;0"
        keyTimes="0;0.45;0.85;1"
        dur="5s"
        repeatCount="indefinite"/>
</rect>
  </clipPath> 
</defs>
  <!-- Background -->

  <rect
    width="1600"
    height="240"
    rx="35"
    fill="url(#bg)"/>

  <!-- Stars -->
    <g fill="white">

    <circle cx="90" cy="45" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="180" cy="85" r="1.5">
      <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="320" cy="55" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="470" cy="40" r="1.8">
      <animate attributeName="opacity" values="1;0;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="640" cy="70" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="820" cy="45" r="2">
      <animate attributeName="opacity" values="1;0;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="990" cy="80" r="1.6">
      <animate attributeName="opacity" values="0;1;0" dur="2.7s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1120" cy="50" r="2">
      <animate attributeName="opacity" values="1;0;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Wave 1 -->

  <path
    fill="white"
    fill-opacity="0.08"
    d="M0 185
       C180 220 280 300 450 255
       C650 205 780 300 1200 240
       L1600 240
       L0 240 Z">

    <animate
      attributeName="d"
      dur="8s"
      repeatCount="indefinite"
      values="
      M0 250 C180 220 280 300 450 255 C650 205 780 300 1200 240 L1200 320 L0 320 Z;
      M0 240 C150 290 320 200 500 260 C700 310 900 210 1200 250 L1200 320 L0 320 Z;
      M0 250 C180 220 280 300 450 255 C650 205 780 300 1200 240 L1200 320 L0 320 Z"/>
  </path>

  <!-- Wave 2 -->

  <path
    fill="white"
    fill-opacity="0.04"
    d="M0 205
       C200 250 380 315 600 280
       C800 245 980 315 1200 270
       L1600 240
       L0 240 Z">

    <animate
      attributeName="d"
      dur="10s"
      repeatCount="indefinite"
      values="
      M0 275 C200 250 380 315 600 280 C800 245 980 315 1200 270 L1200 320 L0 320 Z;
      M0 265 C180 315 420 240 650 295 C860 250 1030 305 1200 260 L1200 320 L0 320 Z;
      M0 275 C200 250 380 315 600 280 C800 245 980 315 1200 270 L1200 320 L0 320 Z"/>
  </path>

    <!-- Typing Animation -->

  
 



     <text
    x="800"
    y="145"
    text-anchor="middle"
    dominant-baseline="middle"
    clip-path="url(#typingClip)"
    font-family="Segoe UI, Arial, Helvetica, sans-serif"
    font-size="56"
    font-weight="700"
    fill="black"
    >
    Hi, I'm Srishti Garg
</text>

  
<text
    x="1180"
    y="145"
    font-size="42">

    🚀

    <animateMotion
        dur="4s"
        repeatCount="indefinite"
        path="M0 0 C40 -30 80 -30 120 0 C80 30 40 30 0 0"/>

</text>
    <!-- Soft Highlight -->
  <ellipse
      cx="800"
      cy="220"
      rx="520"
      ry="90"
      fill="white"
      opacity="0.03">

      <animate
          attributeName="opacity"
          values="0.02;0.05;0.02"
          dur="6s"
          repeatCount="indefinite"/>

  </ellipse>

</svg>
